<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Parser AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <nav class="border-b border-slate-800 bg-slate-950/70 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="{{ url_for('main.index') }}" class="flex items-center gap-2">
        <span class="text-xl font-bold bg-gradient-to-r from-teal-400 to-indigo-500 bg-clip-text text-transparent">ResumeParse.ai</span>
      </a>
      <div class="flex items-center gap-6 text-sm font-medium">
        <a href="{{ url_for('main.index') }}" class="text-slate-300 hover:text-white transition">Upload</a>
        <a href="{{ url_for('main.candidates') }}" class="text-slate-300 hover:text-white transition">Database</a>
      </div>
    </div>
  </nav>

  <main class="flex-1 max-w-6xl w-full mx-auto px-6 py-8">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mb-6 space-y-2">
          {% for category, msg in messages %}
            <div class="p-4 rounded-xl text-sm font-medium border {% if category == 'success' %}bg-emerald-950/40 border-emerald-800 text-emerald-300{% else %}bg-rose-950/40 border-rose-800 text-rose-300{% endif %}">
              {{ msg }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
